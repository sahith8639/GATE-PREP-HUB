services:
  - type: web
    name: gate-prep-hub
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/gateprep.db
      - key: PYTHON_VERSION
        value: 3.12.8
    disk:
      name: gateprep-persistent-data
      mountPath: /var/data
      sizeGB: 1
